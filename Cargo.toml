[package]
name = "ashlogin"
version = "0.2.0"
edition = "2024"
description = "A small Rust CLI that selects a configured server and launches system ssh"
license = "MIT"
repository = "https://github.com/life2you/AshLogin"
homepage = "https://github.com/life2you/AshLogin"
readme = "README.md"
keywords = ["ssh", "cli", "terminal", "login"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
